# ai-chat-debug — static server of the agent builders' debugger page (spec §17.1).
# Stateless: no env, no config module, and no cookies (the gateway strips Cookie toward static upstreams; nothing here
# reads one). The gateway proxies /ai-chat-debug/ here WITH the prefix; every asset URL in the page is relative to it.
# The page's /api/pod/* calls go to the engine on the same origin, never here.
# Caching: the page shell and every unversioned file revalidate (no-cache + ETag); the content-hashed bundle and the
# JET-version-named directories never change at the same URL (immutable).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;     # relative Location: the public host and scheme are the gateway's

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ai-chat-debug {
        return 301 /ai-chat-debug/;
    }

    # The page shell: always revalidate, so a new build is picked up on reload. Only our origin may frame it (the agent
    # UI's side panel).
    location = /ai-chat-debug/ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header X-Content-Type-Options nosniff;
        try_files /ai-chat-debug/index.html =404;
    }
    location = /ai-chat-debug/index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header X-Content-Type-Options nosniff;
    }

    # The content-hashed bundle (js/bundle.<sha256:16>.js) and the version-named directories (JET libs, Redwood theme,
    # icon font). Quoted: a regex with braces must be.
    location ~ "^/ai-chat-debug/js/bundle\.[0-9a-f]{16}\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    location ~ ^/ai-chat-debug/(js/libs/oj|css/redwood|css/theme-redwood|css/ojux)/[0-9][0-9.]*/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Everything else of the build (Core Pack, preact, the pack's own files: unversioned paths): revalidate.
    location /ai-chat-debug/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Nothing else is served; no SPA fallback.
    location / {
        return 404;
    }
}
