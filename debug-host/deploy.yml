# Deployment self-description of the agent builders' debugger page (contract: devops/manifest-schema.md).
# The fusion-ai-chat repo root's deploy.yml describes the JET pack (client-artifact); this one the static image.
name: ai-chat-debug
kind: service
contains: [ai-chat-debug]
needs:
  always: []                 # stateless static server; the GATEWAY needs it, it needs nothing
  per_target:
    dev: []
    prod-vultr: []
    appliance: []
  optional: []
images:
  - gnimsys/ai-chat-debug:latest
env_contract: {}             # none: no env, no entry, no Config API module
modules: {}
config_ship: []              # nginx.conf is baked into the image
target_notes:
  all: >
    Build: `docker build -f debug-host/Dockerfile -t gnimsys/ai-chat-debug:latest .` with the fusion-ai-chat repo root
    as context (the build stage runs `npm run build:debug-host`, which downloads Oracle's UX icon font at the version
    pinned in oraclejetconfig.json fontUrl into the image: the build needs internet, the running page does not).
    Container listens on :80 (GET /healthz). Gateway: the fusion-ai-agent vhost proxies /ai-chat-debug/ (exact prefix,
    NOT stripped; /ai-chat-debug redirects to it) to ai-chat-debug:80 behind the agent login gate, Cookie stripped like
    the other static upstreams; the page calls the engine's /api/pod/* on the same origin. The webc side panel iframes
    /ai-chat-debug/ (same origin; the page sends frame-ancestors 'self').
  dev: "same as prod-vultr; no dev binds (rebuild the image for a new page build)"
  prod-vultr: "image streamed like every other; `up -d --no-build ai-chat-debug`"
  appliance: "not deployed: the appliance has no gateway and no fusion-ai-agent vhost"
