<!DOCTYPE html>
<!--
  The agent builders' debugger page (spec §17.1): the app shell's page for the debug-host build flavour
  (`npm run build:debug-host`; scripts/hooks/debug-host.js puts it in place of src/index.html). The build lands in
  dist/debug-host/, which agent-ui serves under /ai-chat-debug/ on the fusion-ai-agent vhost; shown in the agent UI's
  side panel. Every asset URL is relative.
  The agent chat binds the run through the URL: ?pod=/api/pod/c/<conversationId>/&workflow=<code>&version=DRAFT|PUBLISHED.
-->
<html lang="en-us">
  <head>
    <title>AI Chat Debugger</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
    <link rel="icon" href="css/images/JET-Favicon-Red-32x32.png" type="image/x-icon" />

    <!-- JET's Redwood theme, from this build -->
    <!-- injector:theme -->
    <!-- endinjector -->
    <!-- Redwood UX icon font (oj-ux-ico-*); the debug-host hook serves it from this build -->
    <!-- injector:font -->
    <!-- endinjector:font -->

    <style>
      /* The page fills the side panel's frame and the chat takes the height the form leaves: no utility class sets a
         viewport height or a flex basis with min-height 0. */
      html, body { height: 100%; margin: 0; }
      #globalBody { height: 100%; }
      .dbg-chat { flex: 1 1 auto; min-height: 0; }
      /* The chat fills its area (the component's default is 560px; its README: set your own height on the tag). */
      .dbg-chat xxx-gnimsys-ai-chat { height: 100%; }
    </style>
  </head>
  <body class="oj-web-applayout-body">
    <div id="globalBody" class="oj-flex oj-sm-flex-direction-column oj-sm-flex-wrap-nowrap">
      <div class="oj-sm-padding-4x-horizontal oj-sm-padding-2x-vertical">
        <h1 class="oj-typography-heading-xs oj-sm-margin-0">AI Chat Debugger</h1>
        <!-- The run the agent chat bound through the URL (read-only: the page has no inputs). -->
        <oj-bind-if test="[[hasBound]]">
          <p data-testid="dbg-bound" class="oj-typography-body-sm oj-text-color-secondary oj-sm-margin-0"><oj-bind-text value="[[bound]]"></oj-bind-text></p>
        </oj-bind-if>
      </div>
      <oj-bind-if test="[[hasOpenFromChat]]">
        <oj-c-message-banner data-testid="dbg-open-from-chat" class="oj-sm-margin-4x-horizontal oj-sm-margin-2x-bottom" type="section"
          data="[[openFromChat]]"></oj-c-message-banner>
      </oj-bind-if>
      <oj-bind-if test="[[hasNotices]]">
        <oj-c-message-banner data-testid="dbg-notices" class="oj-sm-margin-4x-horizontal oj-sm-margin-2x-bottom" type="section"
          data="[[notices]]"></oj-c-message-banner>
      </oj-bind-if>
      <div class="dbg-chat oj-flex oj-sm-flex-direction-column oj-sm-padding-4x-horizontal oj-sm-padding-2x-bottom" data-testid="dbg-chat">
        <oj-bind-if test="[[chat]]">
          <xxx-gnimsys-ai-chat config="[[chat().config]]" user="[[chat().user]]" rest-helper="[[chat().restHelper]]"
            endpoint="[[chat().endpoint]]"></xxx-gnimsys-ai-chat>
        </oj-bind-if>
      </div>
    </div>

    <!-- injector:scripts -->
    <!-- endinjector -->
  </body>
</html>
